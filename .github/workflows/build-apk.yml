name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install Android platform + build-tools (runner SDK is preinstalled)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: .
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK before upload (signature, integrity, identity)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          echo "--- file ---"
          ls -lh "$APK"
          echo "--- sha256 ---"
          sha256sum "$APK"
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK"
          echo "--- package identity ---"
          "$BT/aapt" dump badging "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
